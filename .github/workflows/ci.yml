name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Install and smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          scout investigate --repo examples/cancellation --task "Investigate whether Request::cancel removes queued callbacks." --output .scout/ci --max-steps 6
          scout investigate --repo examples/cancellation --task "Investigate whether Request::cancel removes queued callbacks." --output .scout/ci-followups --max-steps 12 --max-followups 6
          scout investigate --repo examples/cancellation --task "Investigate whether Request::cancel removes queued callbacks." --output .scout/ci-restores --max-steps 12 --max-context-chars 40 --max-restores 3
          scout recover --evidence .scout/ci/evidence.json --repo examples/cancellation --observation o0001 --output .scout/ci-recovery --max-context-chars 40
          scout compare --repo examples/cancellation --task "Investigate whether Request::cancel removes queued callbacks." --output .scout/ci-comparison --max-steps 12 --max-followups 3 --max-restores 3 --max-context-chars 40
          python - <<'PY'
          import json
          from pathlib import Path
          from jev_scout import __version__

          assert __version__ == "0.5.0"
          investigation = Path(".scout/ci")
          assert all((investigation / name).is_file() for name in ("events.jsonl", "evidence.json", "report.md"))
          assert json.loads((investigation / "evidence.json").read_text())["observations"]
          followups = json.loads(Path(".scout/ci-followups/evidence.json").read_text())
          assert followups["expansion"]["generated_candidates"] > 0
          assert len(followups["candidates"]) <= 100
          assert len(followups["observations"]) <= followups["steps"] <= 12
          generated = {entry["candidate_id"] for entry in followups["generated_candidate_lineage"]}
          assert any(observation["candidate_id"] in generated for observation in followups["observations"])
          restores = json.loads(Path(".scout/ci-restores/evidence.json").read_text())
          assert restores["schema_version"] == 3
          assert restores["restoration"]["generated_candidates"] == 3
          assert restores["action_counts"]["restore_observation"] == 3
          assert all(check["outcome"] == "restored" for check in restores["restoration_checks"])
          assert len(restores["observations"]) == restores["action_counts"]["read_snippet"]
          assert sum(restores["action_counts"].values()) == restores["steps"] <= 12
          assert restores["context"]["characters"] <= 40
          recovery = json.loads(Path(".scout/ci-recovery/recovery.json").read_text())
          assert recovery["context"]["characters"] <= 40
          assert recovery["context"]["active"][0]["observation_id"] == "o0001"
          assert recovery["observations"][0]["validity"] == "current_at_recovery_check"
          comparison = Path(".scout/ci-comparison")
          summary = json.loads((comparison / "comparison.json").read_text())
          assert summary["schema_version"] == 3
          assert summary["agreement"]["exact_action_sequence_match"] is True
          assert summary["arms"]["challenger"]["transport"] == "none"
          for arm in ("rule", "challenger"):
              bundle = json.loads((comparison / arm / "evidence.json").read_text())
              assert bundle["source_mode"] == "frozen"
              assert bundle["snapshot_id"] == summary["snapshot_id"]
              assert summary["arms"][arm]["successful_restores"] > 0
              assert all(check["current_sha256"] is None for check in bundle["restoration_checks"])
              assert all(check["validity"] == "matched_frozen_snapshot" for check in bundle["restoration_checks"])
              assert (comparison / arm / "report.md").is_file()
          PY
