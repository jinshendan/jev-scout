name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Install and smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          scout investigate --repo examples/cancellation --task "Investigate whether Request::cancel removes queued callbacks." --output .scout/ci --max-steps 6
          python -c "import json; from pathlib import Path; p = Path('.scout/ci'); assert all((p / n).is_file() for n in ('events.jsonl', 'evidence.json', 'report.md')); assert json.loads((p / 'evidence.json').read_text())['observations']"
